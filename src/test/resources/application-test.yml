# Used by the automated tests. By default tests run on an in-memory H2 database in MySQL mode.
# To run them against a real MySQL instead, set these environment variables before running Maven:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
spring:
  datasource:
    url: jdbc:h2:mem:vsms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false
vsms:
  admin:
    username: admin
    password: Test-Admin-Pass-1
  sample-data:
    enabled: true
