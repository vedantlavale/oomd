<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: authLayout(title='Access denied', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="auth-card narrow">
        <section class="auth-form text-center">
            <div class="error-code">403</div>
            <h1 class="fs-4 mt-2">Access denied</h1>
            <p class="text-muted">Your role does not allow you to open this page or perform this action.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
                <a class="btn btn-primary" th:href="@{/}"><i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Go to dashboard</a>
                <a class="btn btn-outline-secondary" href="javascript:history.back()"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Go back</a>
            </div>
        </section>
    </div>
</th:block>
</body>
</html>
