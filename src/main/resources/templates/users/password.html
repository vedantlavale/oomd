<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(title='Reset password', active='users', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <a th:replace="~{fragments/components :: backLink('/users', 'Back to users')}"></a>
    <div class="page-header">
        <div>
            <h1 class="page-title">Reset password <small class="text-muted" th:text="${user.username}">admin</small></h1>
            <p class="page-subtitle">Set a new password for <span th:text="${user.fullName}">Name</span>.</p>
        </div>
    </div>

    <section class="panel form-narrow">
        <form th:object="${passwordResetForm}" th:action="@{/users/{id}/password(id=${user.id})}" method="post" class="panel-body" novalidate>
            <div th:replace="~{fragments/components :: formErrors}"></div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="newPassword" class="form-label required">New password</label>
                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}" th:errorclass="is-invalid"
                           required maxlength="72" autocomplete="new-password" aria-describedby="passwordHelp">
                    <div class="invalid-feedback" th:errors="*{newPassword}">Error</div>
                    <div class="form-text" id="passwordHelp">Use 8 to 72 characters with at least one letter and one digit.</div>
                </div>
                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label required">Repeat new password</label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" th:errorclass="is-invalid"
                           required maxlength="72" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}">Error</div>
                    <div class="invalid-feedback" th:errors="*{passwordsMatch}">Error</div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="bi bi-key me-1" aria-hidden="true"></i>Set password</button>
                <a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a>
            </div>
        </form>
    </section>
</th:block>
</body>
</html>
