<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(title='Payments', active='payments', content=~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Payments</h1>
            <p class="page-subtitle">Every payment recorded against an invoice. To record one, open the invoice.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-outline-secondary" th:href="@{/invoices(status='UNPAID')}"><i class="bi bi-hourglass-split me-1" aria-hidden="true"></i>Unpaid invoices</a>
        </div>
    </div>

    <section class="panel" th:with="base=@{/payments(q=${q}, method=${method}, status=${status}, from=${from}, to=${to})}">
        <form class="filter-bar" method="get" th:action="@{/payments}" role="search">
            <div class="filter-field grow">
                <label for="q">Search</label>
                <div class="search-field">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input type="search" class="form-control" id="q" name="q" th:value="${q}"
                           placeholder="Customer, registration number, invoice number or reference" maxlength="100">
                </div>
            </div>
            <div class="filter-field">
                <label for="method">Method</label>
                <select class="form-select" id="method" name="method">
                    <option value="">All methods</option>
                    <option th:each="m : ${methods}" th:value="${m}" th:text="${m.label}" th:selected="${m == method}">Cash</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="status">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${recordStatuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == status}">Successful</option>
                </select>
            </div>
            <div class="filter-field">
                <label for="from">Paid from</label>
                <input type="date" class="form-control" id="from" name="from" th:value="${from}">
            </div>
            <div class="filter-field">
                <label for="to">Paid to</label>
                <input type="date" class="form-control" id="to" name="to" th:value="${to}">
            </div>
            <div class="filter-actions">
                <button type="submit" class="btn btn-primary">Apply</button>
                <a class="btn btn-outline-secondary" th:href="@{/payments}"
                   th:if="${(q != null and !q.isBlank()) or method != null or status != null or from != null or to != null}">Clear</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-vsms">
                <caption class="visually-hidden">Payments</caption>
                <thead>
                <tr>
                    <th scope="col">Receipt</th>
                    <th scope="col">Paid on</th>
                    <th scope="col">Invoice</th>
                    <th scope="col">Customer</th>
                    <th scope="col">Method</th>
                    <th scope="col" class="num">Amount</th>
                    <th scope="col">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${page.content}" th:classappend="${p.status.name() == 'REVERSED'} ? 'row-muted'">
                    <td class="cell-primary"><a th:href="@{/payments/{id}(id=${p.id})}" th:text="${p.receiptNumber}">PAY-000001</a></td>
                    <td th:text="${#temporals.format(p.paidAt, 'dd MMM yyyy, hh:mm a')}">01 Jan 2026</td>
                    <td><a th:href="@{/invoices/{id}(id=${p.invoice.id})}" th:text="${p.invoice.invoiceNumber}">INV-000001</a></td>
                    <td th:text="${p.invoice.serviceJob.customer.name}">Customer
                        <span class="cell-sub" th:text="${p.invoice.serviceJob.vehicle.registrationNumber}">MH12AB1234</span></td>
                    <td><span th:text="${p.method.label}">Cash</span>
                        <span class="cell-sub" th:if="${p.reference}" th:text="${p.reference}">ref</span></td>
                    <td class="num fw-600" th:text="${@fmt.money(p.amount)}">₹0.00</td>
                    <td><span th:replace="~{fragments/components :: badge(${p.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.empty}"><div th:replace="~{fragments/components :: emptyState('bi-cash-coin', 'No payments found', 'Adjust the filters, or record a payment from an invoice.')}"></div></th:block>

        <div class="panel-footer">
            <p th:replace="~{fragments/components :: resultSummary(${page})}"></p>
            <nav th:replace="~{fragments/components :: pagination(${page}, ${base})}"></nav>
        </div>
    </section>
</th:block>
</body>
</html>
